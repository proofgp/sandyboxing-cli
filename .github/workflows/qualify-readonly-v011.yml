name: Qualify immutable read-only CLI v0.1.1 (Linux only)

on:
  workflow_dispatch:
    inputs:
      acquisition_mode:
        description: Draft qualification before publication; anonymous fresh install after publication
        required: true
        type: choice
        options: [draft, public]
        default: draft
      release_review:
        description: Parent confirms independent review of this exact workflow and harness
        required: true
        type: choice
        options: [hold, reviewed]
        default: hold

permissions:
  contents: read

concurrency:
  group: readonly-v011-qualification
  cancel-in-progress: false

jobs:
  draft_download:
    if: >-
      ${{ !cancelled() &&
      github.repository == 'proofgp/sandyboxing-cli' &&
      github.event.repository.private == false &&
      inputs.release_review == 'reviewed' &&
      inputs.acquisition_mode == 'draft' }}
    permissions:
      contents: write
    outputs:
      started-ms: ${{ steps.acquire.outputs.started-ms }}
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Download exact draft assets (only credential-bearing step)
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/sandy-v011-gh-${{ github.run_id }}-${{ github.run_attempt }}
          DRAFT_ASSETS: ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          printf 'started-ms=%s\n' "$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          mkdir "$DRAFT_ASSETS"
          timeout --signal=KILL 120s bash -euo pipefail -c '
            gh release view v0.1.1 --repo proofgp/sandyboxing-cli --json isDraft,tagName > "$DRAFT_ASSETS/release.json"
            jq -e -s '\''length == 1 and .[0] == {isDraft:true,tagName:"v0.1.1"}'\'' "$DRAFT_ASSETS/release.json" > /dev/null
            gh release download v0.1.1 --repo proofgp/sandyboxing-cli --pattern sandyboxing-read-only-0.1.1.tgz --pattern SHA256SUMS --dir "$DRAFT_ASSETS"
          '
      - name: Verify exact draft inputs before transfer
        env:
          DRAFT_ASSETS: ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          [[ -d "$DRAFT_ASSETS" && ! -L "$DRAFT_ASSETS" ]] || exit 1
          shopt -s dotglob nullglob
          files=("$DRAFT_ASSETS"/*)
          [[ ${#files[@]} -eq 3 ]] || exit 1
          for name in SHA256SUMS release.json sandyboxing-read-only-0.1.1.tgz; do
            [[ -f "$DRAFT_ASSETS/$name" && ! -L "$DRAFT_ASSETS/$name" ]] || exit 1
          done
          [[ $(wc -c < "$DRAFT_ASSETS/release.json") -le 1024 ]] || exit 1
          [[ $(wc -c < "$DRAFT_ASSETS/SHA256SUMS") -le 512 ]] || exit 1
          [[ $(wc -c < "$DRAFT_ASSETS/sandyboxing-read-only-0.1.1.tgz") -eq 80233 ]] || exit 1
          jq -e -s 'length == 1 and .[0] == {isDraft:true,tagName:"v0.1.1"}' "$DRAFT_ASSETS/release.json" > /dev/null
          cmp -s "$DRAFT_ASSETS/SHA256SUMS" <(printf 'a166ebde41b87ed5c66270db0d68bf0bbdf173ff72259721503703034b821f9a  sandyboxing-read-only-0.1.1.tgz\n')
          (cd "$DRAFT_ASSETS" && sha256sum --check --status SHA256SUMS)
      - name: Transfer only verified draft inputs
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # retained v010 reviewed pin
        with:
          name: readonly-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
            ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}/release.json
            ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}/sandyboxing-read-only-0.1.1.tgz
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          overwrite: false
          compression-level: 0

  qualify:
    needs: [draft_download]
    if: >-
      ${{ !cancelled() &&
      github.repository == 'proofgp/sandyboxing-cli' &&
      github.event.repository.private == false &&
      inputs.release_review == 'reviewed' &&
      ((inputs.acquisition_mode == 'public' && needs.draft_download.result == 'skipped') ||
      (inputs.acquisition_mode == 'draft' && needs.draft_download.result == 'success')) }}
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      SANDY_RELEASE_REVIEW: ${{ inputs.release_review }}
      SANDY_ACQUISITION_MODE: ${{ inputs.acquisition_mode }}
      SANDY_QUALIFICATION_STARTED_MS: ${{ needs.draft_download.outputs.started-ms }}
    steps:
      - name: Checkout public release-only repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # retained v010 reviewed pin
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Use exact Node runtime (no global npm/tool installs)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # retained v010 reviewed pin
        with:
          node-version: '24.22.2'
          architecture: x64
          check-latest: false
          token: ''
      - name: Calibrate pure acceptance guards
        run: node --test qualification-v011/selftest.mjs qualification-v011/acquisition-selftest.mjs qualification-v011/policy-selftest.mjs qualification-v011/compact-selftest.mjs
      - name: Validate native gates and shared ten-minute budget
        id: preflight
        run: node qualification-v011/preflight.mjs >> "$GITHUB_OUTPUT"
      - name: Receive exact draft inputs from this run only
        if: inputs.acquisition_mode == 'draft'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # resolved v4 commit
        with:
          name: readonly-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Qualify exact bytes, empty-cache install, doctor and SDK
        env:
          SANDY_QUALIFICATION_STARTED_MS: ${{ steps.preflight.outputs.started-ms }}
          DRAFT_ASSETS: ${{ runner.temp }}/sandy-v011-draft-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$SANDY_ACQUISITION_MODE" == draft ]]; then
            node qualification-v011/qualify.mjs qualification-v011-run "$DRAFT_ASSETS"
          else
            node qualification-v011/qualify.mjs qualification-v011-run
          fi
      - name: Retain small public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # retained v010 reviewed pin
        with:
          name: readonly-v011-linux-x64-${{ inputs.acquisition_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-v011-run/evidence/*.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          compression-level: 6
